# Pings Supabase daily so the Free-tier project is not paused after 7 days
# of inactivity. Supabase counts database REST requests — not dashboard visits.
#
# One-time setup (GitHub → repo → Settings → Secrets and variables → Actions):
#   SUPABASE_URL        = https://YOUR_REF.supabase.co
#   SUPABASE_ANON_KEY   = your anon public key (same as VITE_SUPABASE_ANON_KEY)
#
# Test: Actions tab → "Supabase Keep Alive" → Run workflow.
#
# Paid alternative: Supabase Pro never auto-pauses ($25/mo).

name: Supabase Keep Alive

on:
  schedule:
    # Every day at 06:00 UTC (well inside the 7-day window).
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Legacy names — remove after migrating secrets.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL:-$VITE_SUPABASE_URL}"
          KEY="${SUPABASE_ANON_KEY:-$VITE_SUPABASE_ANON_KEY}"

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Missing secrets. Add SUPABASE_URL and SUPABASE_ANON_KEY in GitHub → Settings → Secrets → Actions."
            exit 1
          fi

          URL="${URL%/}"

          # Lightweight SELECT — this is what Supabase counts as database activity.
          # profiles is always present; anon may get an empty array under RLS, which is fine.
          HTTP_CODE=$(curl -s -o /tmp/supabase-ping.txt -w "%{http_code}" \
            "${URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}")

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/supabase-ping.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Keep-alive ping failed"
            exit 1
          fi

          echo "Keep-alive OK"
